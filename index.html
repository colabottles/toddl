<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Overall logo size */
    .logo {
      width: min(70vw, 500px);
      aspect-ratio: 1;
      position: relative;
    }

    /* Main T */
    .t {
      position: absolute;
      inset: 0;
      background: #f4eed8;

      /* Build a blocky T */
      clip-path: polygon(0% 0%,
          100% 0%,
          100% 18%,
          60% 18%,
          60% 100%,
          40% 100%,
          40% 18%,
          0% 18%);

      border-radius: 8px;
    }

    /* Vintage stripe fill */
    .t::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(-55deg,
          transparent 0px,
          transparent 8px,
          rgba(0, 0, 0, .88) 8px,
          rgba(0, 0, 0, .88) 12px);

      mix-blend-mode: multiply;

      clip-path: inherit;
    }

    /* Cream outline over stripes */
    .t::before {
      content: "";
      position: absolute;
      inset: 18px;
      background: #f4eed8;

      clip-path: polygon(0% 0%,
          100% 0%,
          100% 18%,
          60% 18%,
          60% 100%,
          40% 100%,
          40% 18%,
          0% 18%);
    }
  </style>
</head>

<body>

  <div class="logo">
    <div class="t"></div>
  </div>

</body>

</html>
